name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  portable:
    name: Portable local gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.19"

      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Install locked test dependencies
        run: |
          uv sync --locked
          npm ci
          command -v shellcheck
          shellcheck --version

      - name: Verify complete portable candidate
        run: bash scripts/verify-local.sh
